# FreshCart High-Concurrency Nginx Configuration (Tuned for 5,000+ Concurrent Users behind AWS ALB)

upstream node_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 256; # Keep 256 idle upstream connections open to avoid TCP connection churning
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Performance & Socket Buffer Tuning for 5000+ CCU
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API Reverse Proxy to Node.js / Express Cluster
    location /api/ {
        proxy_pass http://node_backend;
        proxy_http_version 1.1;

        # WebSocket & Keepalive Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection ""; # Clear Connection header for HTTP/1.1 keepalive pooling
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fast Response Buffering
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # Uploads (Local Fallback Assets / Fast Disk Cache)
    location /uploads/ {
        alias /var/www/freshcart/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Static Frontend Web Application (React / Vite Build)
    location / {
        root /var/www/freshcart/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets (CSS, JS, WebP) with 1-year immutability
        location ~* \.(?:css|js|webp|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
